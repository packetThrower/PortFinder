name: portfinder
arch: amd64
platform: linux
version: "${VERSION}"
maintainer: "packetThrower <6597817+packetThrower@users.noreply.github.com>"
description: "Network switch port discovery tool using CDP/LLDP"
homepage: ""
license: ""

depends:
  - libpcap0.8

overrides:
  rpm:
    depends:
      - libpcap
  archlinux:
    depends:
      - libpcap

contents:
  - src: build/bin/PortFinder
    dst: /usr/bin/portfinder
    file_info:
      mode: 0755

  - src: build/appicon.png
    dst: /usr/share/icons/hicolor/256x256/apps/portfinder.png

  - src: packaging/portfinder.desktop
    dst: /usr/share/applications/portfinder.desktop

scripts:
  postinstall: packaging/postinstall.sh
