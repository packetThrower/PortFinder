_version: 1

# Japanese (日本語). Translations cover the high-visibility UI
# surface; less-visible strings fall back to en.yml via rust-i18n.
#
# NOTE: gpui's default font may not include CJK glyphs — kanji /
# hiragana / katakana may render as tofu boxes until a CJK-capable
# font is configured. Tested first on macOS where the system font
# fallback typically resolves CJK; Linux / Windows may need a
# `fonts.system_ui` override.

