name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-linux:
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install NFPM
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build
        run: |
          cd frontend && pnpm install && cd ..
          VERSION=${GITHUB_REF_NAME#v}
          wails build -platform linux/amd64 -tags webkit2_41 -ldflags "-X main.Version=$VERSION"

      - name: Package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p dist
          VERSION=$VERSION nfpm package --packager deb --target dist/
          VERSION=$VERSION nfpm package --packager rpm --target dist/
          VERSION=$VERSION nfpm package --packager archlinux --target dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/

  build-macos:
    needs: [ci]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build
        run: |
          cd frontend && pnpm install && cd ..
          VERSION=${GITHUB_REF_NAME#v}
          wails build -platform darwin/universal -ldflags "-X main.Version=$VERSION"

      - name: Package app
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cd build/bin
          zip -r ../../PortFinder-macOS-${VERSION}.zip PortFinder.app

      - name: Build BPF helper pkg
        run: ./packaging/macos/build-pkg.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: |
            PortFinder-macOS-*.zip
            dist/PortFinder-BPF-*.pkg

  build-windows:
    needs: [ci]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Npcap SDK
        id: cache-npcap
        uses: actions/cache@v4
        with:
          path: npcap-sdk
          key: npcap-sdk-1.13

      - name: Download Npcap SDK
        if: steps.cache-npcap.outputs.cache-hit != 'true'
        run: |
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-1.13.zip" -OutFile npcap-sdk.zip
          Expand-Archive npcap-sdk.zip -DestinationPath npcap-sdk
        shell: powershell

      - name: Configure Npcap SDK env
        run: |
          echo "CGO_CFLAGS=-I${{ github.workspace }}\npcap-sdk\Include" >> $env:GITHUB_ENV
          echo "CGO_LDFLAGS=-L${{ github.workspace }}\npcap-sdk\Lib\x64" >> $env:GITHUB_ENV
        shell: powershell

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend deps
        run: pnpm install
        working-directory: frontend

      - name: Build
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          wails build -ldflags "-X main.Version=$version"
        shell: powershell

      - name: Package
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          Compress-Archive -Path build\bin\PortFinder.exe -DestinationPath "PortFinder-Windows-${version}.zip"
        shell: powershell

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: PortFinder-Windows-*.zip

  release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux-packages/*
            artifacts/macos-package/*
            artifacts/windows-package/*
          generate_release_notes: true
