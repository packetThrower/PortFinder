name: Release

on:
  push:
    tags:
      # Stable SemVer: v4.0.0, v4.1.2, etc.
      - "v[0-9]+.[0-9]+.[0-9]+"
      # Pre-release SemVer: v4.0.0-alpha.1, v4.1.0-rc.2, etc. The
      # release job inspects the tag and flips prerelease=true on
      # the GitHub Release when a hyphen is present.
      - "v[0-9]+.[0-9]+.[0-9]+-*"

# No workflow-level `permissions:` — each job declares its own so
# the `contents: write` needed to publish the release is scoped to
# the one job that actually creates it.

# Queue, don't cancel: a mid-flight release shouldn't be interrupted
# by a retag of the same version (half-uploaded artifact risk).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Single macOS build job that cross-compiles BOTH arm64 and
  # x86_64 binaries on the Apple Silicon runner. The retired
  # `macos-15-intel` entry took 20+ minutes end-to-end (small
  # runner pool + slower CPU); cross-compiling x86_64 on macos-26
  # finishes in ~5-8 minutes on top of the native arm64 build.
  # gpui's native deps (ring, psm, tree-sitter, stacker) all
  # cross-compile cleanly between the two Apple targets — they
  # use the standard cc-rs / cmake-rs build scripts that pick up
  # the cross target from `CARGO_BUILD_TARGET`.
  build-macos:
    needs: [ci]
    permissions:
      contents: read
    runs-on: macos-26
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Install both targets so we can build both arches from
      # this one Apple Silicon runner. aarch64 is the host so
      # rustup would have it implicitly, but listing it for
      # symmetry / clarity.
      - name: Setup Rust (stable + both Apple targets)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # `shared-key: release` makes successive release-tag runs
      # share the release-mode `target/` cache across tags.
      # Cross-compile produces separate `target/<triple>/release`
      # subdirs so the cache covers both arches in one entry.
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: release
          # Preserve the cache even when a later step (build,
          # packaging, hdiutil DMG mount) fails. Default discards
          # on failure, which made the alpha.2 hdiutil flake force
          # a full 10-min cold compile on the rerun — this flag
          # makes the retry pick up where the failed run left off.
          cache-on-failure: true

      - name: Install macOS build deps
        run: brew install pkg-config

      - name: Install cargo-packager
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-packager

      - name: Patch version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            /^\[/ { in_pkg = ($0 == "[package]") }
            in_pkg && /^version = / && !done { print "version = \"" v "\""; done=1; next }
            { print }
          ' Cargo.toml > Cargo.toml.tmp && mv Cargo.toml.tmp Cargo.toml
          # Mirror to Info.plist so CFBundleShortVersionString /
          # CFBundleVersion match the tag rather than the static
          # value sitting in the file.
          plutil -replace CFBundleShortVersionString -string "$VERSION" resources/Info.plist
          plutil -replace CFBundleVersion -string "$VERSION" resources/Info.plist
          echo "Building version: $VERSION"

      # Two cargo-packager invocations, one per target arch.
      # `CARGO_BUILD_TARGET` is the env-var form of cargo's
      # `--target` flag; setting it makes the inner
      # `cargo build --release` from `before-packaging-command`
      # compile for the cross target, and the `--target` flag on
      # cargo-packager itself points it at the matching
      # `target/<triple>/release/` for the resulting binary.
      - name: Build arm64 .app + .dmg
        env:
          CARGO_BUILD_TARGET: aarch64-apple-darwin
        run: cargo packager --release -f app -f dmg --target aarch64-apple-darwin

      - name: Build amd64 .app + .dmg (cross-compile)
        env:
          CARGO_BUILD_TARGET: x86_64-apple-darwin
        run: cargo packager --release -f app -f dmg --target x86_64-apple-darwin

      - name: Build BPF helper .pkg
        # BPF helper is arch-independent (it's a LaunchDaemon
        # plist + shell script); built once and shipped alongside
        # both .dmg files.
        run: ./packaging/macos/build-pkg.sh

      - name: Stage artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release-artifacts

          # Loop both arches, renaming cargo-packager's outputs
          # (which use `aarch64` / `x64` arch labels in their
          # filenames) to our `arm64` / `amd64` convention.
          for pair in "aarch64-apple-darwin:arm64" "x86_64-apple-darwin:amd64"; do
            triple="${pair%%:*}"
            arch="${pair##*:}"
            bundle="target/${triple}/release"

            dmg=$(find "${bundle}" -maxdepth 1 -name 'PortFinder_*.dmg' | head -1)
            if [ -z "$dmg" ]; then
              echo "no .dmg produced for ${arch} at ${bundle}"
              ls -la "${bundle}"
              exit 1
            fi
            mv "$dmg" "release-artifacts/PortFinder_${VERSION}_${arch}.dmg"

            # Drag-droppable .app zip for users who'd rather skip the
            # .dmg mount-and-drag. `ditto -c -k --keepParent` preserves
            # resource forks and extended attributes (matters once
            # signing lands; the .app's xattrs need to survive the
            # round trip through the archive).
            ditto -c -k --keepParent \
              "${bundle}/PortFinder.app" \
              "release-artifacts/PortFinder-macOS-${arch}-${VERSION}.zip"
          done

          # BPF helper .pkg — copied once (arch-independent).
          if ls dist/PortFinder-BPF-*.pkg >/dev/null 2>&1; then
            cp dist/PortFinder-BPF-*.pkg release-artifacts/
          fi

          echo "--- staged ---"
          ls -la release-artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-package
          path: release-artifacts/*

  build-windows:
    needs: [ci]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: amd64
            target: x86_64-pc-windows-msvc
            npcap_lib: x64
          - runner: windows-11-arm
            arch: arm64
            target: aarch64-pc-windows-msvc
            npcap_lib: ARM64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: release
          # Preserve the cache even when a later step (build,
          # packaging, hdiutil DMG mount) fails. Default discards
          # on failure, which made the alpha.2 hdiutil flake force
          # a full 10-min cold compile on the rerun — this flag
          # makes the retry pick up where the failed run left off.
          cache-on-failure: true

      - name: Cache Npcap SDK
        id: cache-npcap
        uses: actions/cache@v6
        with:
          path: npcap-sdk
          key: npcap-sdk-1.13

      - name: Download Npcap SDK
        if: steps.cache-npcap.outputs.cache-hit != 'true'
        run: |
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-1.13.zip" -OutFile npcap-sdk.zip
          Expand-Archive npcap-sdk.zip -DestinationPath npcap-sdk
        shell: powershell

      - name: Configure Npcap link path
        run: |
          echo "LIB=${{ github.workspace }}\npcap-sdk\Lib\${{ matrix.npcap_lib }};$env:LIB" >> $env:GITHUB_ENV
        shell: powershell

      - name: Install cargo-packager
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-packager

      # cargo-wix replaces cargo-packager's `-f wix` path because
      # cargo-packager 0.11 bundles WiX 3.11 (2017) — whose
      # candle.exe predates `-arch arm64` (added in WiX 3.14) —
      # so the arm64 MSI was impossible there. cargo-wix uses
      # the system-installed WiX (provisioned below as 3.14 via
      # chocolatey), which clears that limit. Stable tags only:
      # MSI ProductVersion rejects alphanumeric pre-release
      # identifiers like `4.1.0-beta.1` — NSIS has no such
      # limit, so pre-releases still ship NSIS.
      - name: Install cargo-wix
        if: ${{ !contains(github.ref_name, '-') }}
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-wix

      # WiX 3.14 (current pre-GA build under chocolatey's `--pre`
      # gate) is the minimum that carries `-arch arm64`. choco's
      # package sets the `WIX` env var and adds `<install>\bin` to
      # the system PATH on install, but the current process's
      # environment doesn't pick up those changes until we re-read
      # them — hence the path-write to GITHUB_PATH so the cargo-
      # wix step below can find candle.exe / light.exe without a
      # full session reload.
      - name: Install WiX Toolset 3.14
        if: ${{ !contains(github.ref_name, '-') }}
        shell: pwsh
        run: |
          choco install wixtoolset --pre -y --no-progress
          $wixDir = (Get-ChildItem 'C:\Program Files (x86)\WiX Toolset *' -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if ($wixDir) {
            "$wixDir\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
            "WIX=$wixDir\" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
            Write-Host "WiX installed at $wixDir"
          } else {
            Write-Error "WiX install directory not found after choco install"
            exit 1
          }

      - name: Patch version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          (Get-Content Cargo.toml -Raw) -replace '(?m)^version = .*', "version = `"$version`"" |
            Set-Content -NoNewline Cargo.toml
          Write-Host "Building version: $version"

      # Windows-only: build the console-subsystem `portfinder-cli`
      # sibling alongside the GUI `PortFinder.exe`, then package
      # both into the NSIS installer. macOS / Linux stay single-
      # binary because `required-features = ["windows-cli"]` on
      # the cli `[[bin]]` in Cargo.toml keeps them from compiling
      # it. See `src/lib.rs` for the dual-binary rationale and
      # `packaging/windows/README.md` for the config-override
      # mechanics.
      #
      # The `--config` override is required because cargo-packager's
      # `binaries` field is global — no per-format filter — and
      # listing the cli binary in `[package.metadata.packager]`
      # would also bundle it into the macOS .app and Linux .deb.
      # `Get-Content -Raw` inlines the JSON because cargo-packager
      # 0.11.8 has a bug where `--config <file_path>` errors with
      # "Not a directory" — only raw JSON inline works.
      #
      # cargo-packager's `beforePackagingCommand` (set in
      # Packager.json to `cargo build --release --features
      # windows-cli`) is what actually compiles both binaries
      # into `target/release/`. The cargo-wix step below reuses
      # those binaries via `--no-build`.
      - name: Build .exe (NSIS via cargo-packager)
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $config_obj = Get-Content packaging/windows/Packager.json -Raw | ConvertFrom-Json
          $config_obj | Add-Member -NotePropertyName version -NotePropertyValue $version -Force
          $config = $config_obj | ConvertTo-Json -Depth 10

          # Disable thin LTO on aarch64-pc-windows-msvc only.
          # rustc thin-LTO crashes deterministically with
          # `STATUS_ACCESS_VIOLATION` (0xc0000005) when linking
          # the gpui dep graph on Windows ARM64 — failed both
          # cold-cache and warm-cache reruns on alpha.14. The
          # binary doesn't need the small perf win LTO buys on
          # an event-loop UI app, and dropping it is a net win
          # over auto-rerun shenanigans. amd64 stays on
          # `lto = "thin"` (no crash there).
          if ("${{ matrix.arch }}" -eq "arm64") {
            $env:CARGO_PROFILE_RELEASE_LTO = "false"
          }

          cargo packager --release -f nsis --config $config --out-dir target/release --binaries-dir target/release

      # `--no-build` reuses the just-built binaries at
      # `target/release/PortFinder.exe` + `portfinder-cli.exe`
      # instead of compiling a second time. `--nocapture`
      # streams candle/light output so a WiX failure surfaces
      # in the GH Actions log instead of being buried in
      # cargo-wix's default-quiet wrapper.
      #
      # No `--target` on either cargo packager or cargo wix:
      # the runner is already native for its arch (windows-
      # latest = x64, windows-11-arm = arm64), so the default
      # host target matches what we want. Passing --target
      # would split paths between `target/<triple>/release/`
      # and `target/release/`, confusing both tools'
      # binary-discovery.
      - name: Build .msi (cargo-wix, stable tags only)
        if: ${{ !contains(github.ref_name, '-') }}
        shell: cmd
        run: cargo wix --no-build --nocapture

      - name: Stage artifacts
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $arch = "${{ matrix.arch }}"
          $bundle = "target/release"
          New-Item -ItemType Directory -Force release-artifacts | Out-Null

          Write-Host "--- contents of $bundle ---"
          Get-ChildItem -Path $bundle -File -Recurse | ForEach-Object { $_.FullName }

          # NSIS .exe ships from cargo-packager's output dir.
          Get-ChildItem "$bundle/*-setup.exe" -ErrorAction SilentlyContinue |
            Copy-Item -Destination release-artifacts/

          # MSI ships from cargo-wix's output dir (`target/wix/`).
          # cargo-wix uses kebab-case `portfinder-<version>-<arch>.msi`
          # by default; rename to the existing
          # `PortFinder_<version>_<arch>_en-US.msi` convention so the
          # winget manifest URLs stay stable across the cargo-
          # packager → cargo-wix migration.
          $wixOut = "target/wix"
          if (Test-Path $wixOut) {
            Write-Host "--- contents of $wixOut ---"
            Get-ChildItem -Path $wixOut -File | ForEach-Object { $_.FullName }
            Get-ChildItem "$wixOut/*.msi" -ErrorAction SilentlyContinue | ForEach-Object {
              $dest = "release-artifacts/PortFinder_${version}_${arch}_en-US.msi"
              Copy-Item $_.FullName -Destination $dest
              Write-Host "renamed $($_.Name) -> $(Split-Path -Leaf $dest)"
            }
          }

          # Portable .zip of both binaries for users who don't
          # want an installer. portfinder-cli.exe is the
          # console-subsystem CLI sibling (built via the
          # `windows-cli` feature in the cargo-packager step);
          # PortFinder.exe is the GUI entry. See `src/lib.rs`
          # for why two exist.
          Compress-Archive `
            -Path "$bundle/PortFinder.exe", "$bundle/portfinder-cli.exe" `
            -DestinationPath "release-artifacts/PortFinder-Windows-$arch-$version.zip"

          Write-Host "--- staged ---"
          Get-ChildItem release-artifacts | ForEach-Object { $_.Name }

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-${{ matrix.arch }}-package
          path: release-artifacts/*

  build-linux:
    needs: [ci]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            target: x86_64-unknown-linux-gnu
            rpm_arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-gnu
            rpm_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: release
          # Preserve the cache even when a later step (build,
          # packaging, hdiutil DMG mount) fails. Default discards
          # on failure, which made the alpha.2 hdiutil flake force
          # a full 10-min cold compile on the rerun — this flag
          # makes the retry pick up where the failed run left off.
          cache-on-failure: true

      # libpcap-dev for capture; the wayland/x11 + freetype +
      # fontconfig surface gpui_linux pulls in at compile time;
      # AppImage tooling (fuse / libfuse2 / file); libarchive-
      # tools for fpm -t pacman's bsdtar.
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpcap-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev libxcb1-dev libxcb-randr0-dev \
            libxcb-xkb-dev libxcb-cursor-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb-render0-dev \
            libfontconfig1-dev libfreetype-dev \
            pkg-config \
            file fuse3 libfuse2 ruby-dev \
            libarchive-tools

      - name: Install cargo-packager
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-packager

      - name: Install fpm (for .rpm + .pkg.tar.zst)
        run: sudo gem install --no-document fpm

      - name: Patch version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            /^\[/ { in_pkg = ($0 == "[package]") }
            in_pkg && /^version = / && !done { print "version = \"" v "\""; done=1; next }
            { print }
          ' Cargo.toml > Cargo.toml.tmp && mv Cargo.toml.tmp Cargo.toml
          echo "Building version: $VERSION"

      - name: Build .deb + .AppImage
        run: cargo packager --release -f deb -f appimage

      # cargo-packager 0.11 doesn't expose .deb postinst hooks, so
      # we patch the freshly-built .deb to inject one that runs
      # setcap on the installed binary. Without this, the first
      # capture attempt fails with EPERM and the user has to
      # manually `sudo setcap cap_net_raw+ep /usr/bin/PortFinder`.
      - name: Patch .deb (postinst + lintian cleanups)
        run: |
          set -e
          DEB=$(find target/release -maxdepth 1 -name '*.deb' | head -1)
          if [ -z "$DEB" ]; then
            echo "no .deb produced by cargo-packager — nothing to patch"
            exit 0
          fi
          echo "Patching $DEB"

          WORK=$(mktemp -d)
          dpkg-deb -R "$DEB" "$WORK"
          mkdir -p "$WORK/DEBIAN"

          # All intermediate steps below run as the runner user
          # against runner-owned files (dpkg-deb -R extracts with
          # the build runner's uid:gid, which matches the current
          # runner user, so no chown needed yet). The single
          # `sudo chown -R 0:0` to make the .deb's archive
          # entries root:root happens at the very end, right
          # before `dpkg-deb -b` re-packs. Earlier versions of
          # this step chowned to root up front and then needed
          # `sudo` on every subsequent file op — and glob
          # expansion in the calling shell (still the runner
          # user) broke on root-owned dirs because mktemp -d
          # gives mode 700, so the runner couldn't read them.

          # ----- maintainer hooks ----------------------------------
          cp packaging/linux/portfinder-postinstall.sh "$WORK/DEBIAN/postinst"
          chmod 0755 "$WORK/DEBIAN/postinst"

          # Matching prerm removes the lowercase /usr/bin/portfinder
          # symlink that postinst created. dpkg doesn't track it (the
          # symlink isn't in the .deb file manifest), so without this
          # `apt purge` leaves a dangling link behind.
          cp packaging/linux/portfinder-preremove.sh "$WORK/DEBIAN/prerm"
          chmod 0755 "$WORK/DEBIAN/prerm"

          # ----- control file fixes --------------------------------
          # cargo-packager builds the control file from
          # `[package.metadata.packager]` metadata. Three lintian
          # complaints we can't fix from there:
          #
          #   - `malformed-contact Maintainer Will`: cargo-packager
          #     emits whatever's in `authors[0]` verbatim, so a
          #     bare name gives a malformed RFC822 contact. Force
          #     the Name <email> form here.
          #   - `recommended-field Section`: cargo-packager doesn't
          #     emit a Section line at all. Add `Section: net`.
          #   - `missing-dependency-on-libc`: the binary
          #     dynamically links to libc6 (every Rust binary
          #     does) but lintian wants it spelled in Depends.
          #     Append libc6 to the existing Depends line.
          CONTROL="$WORK/DEBIAN/control"
          sed -i \
            -e 's|^Maintainer: .*$|Maintainer: Will Lehnertz <6597817+packetThrower@users.noreply.github.com>|' \
            -e '/^Priority: /a Section: net' \
            -e 's|^\(Depends: .*\)$|\1, libc6|' \
            "$CONTROL"

          # ----- /usr/share/doc/portfinder/ ------------------------
          # Debian convention: every package ships a copyright file
          # and a changelog.gz under /usr/share/doc/<pkg>/. lintian
          # errors out without them. Source files live in
          # `packaging/linux/` (copyright is static, changelog is
          # a `${VERSION}/${DATE}`-templated stub pointing at the
          # canonical CHANGELOG.md — full per-version Debian
          # changelog entries would duplicate what the repo
          # changelog already covers).
          DOCDIR="$WORK/usr/share/doc/portfinder"
          mkdir -p "$DOCDIR"
          cp packaging/linux/copyright "$DOCDIR/copyright"

          VERSION="${GITHUB_REF_NAME#v}"
          DATE=$(date -R)
          VERSION="$VERSION" DATE="$DATE" \
            envsubst < packaging/linux/changelog.Debian.template \
            > "$DOCDIR/changelog.Debian"
          gzip -9n "$DOCDIR/changelog.Debian"
          chmod 0644 "$DOCDIR"/*

          # ----- root:root ownership -------------------------------
          # cargo-packager's tar packer preserves the build user's
          # uid/gid (1001/1001 on GitHub runners). dpkg installs
          # files with their stored ownership, so on the target
          # system any uid that happens to be 1001 ends up owning
          # /usr/bin/PortFinder. Lintian flags this as
          # `wrong-file-owner-uid-or-gid`. Fix by chowning the
          # entire payload + DEBIAN dir to 0:0 right before the
          # re-pack — `dpkg-deb -b` records the on-disk uid/gid
          # into the .deb's archive entries.

          # ----- re-pack -------------------------------------------
          # `dpkg-deb -b` (and the `rm -rf` below it) need sudo
          # because the `chown -R 0:0` above made the tree
          # unreadable to the runner user (mktemp -d gives mode
          # 700; chown only flips the owner so the mode stays).
          sudo chown -R 0:0 "$WORK"
          sudo dpkg-deb -Z xz -b "$WORK" "$DEB"
          sudo rm -rf "$WORK"

      - name: Build .rpm via fpm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.rpm_arch }}"
          BIN="target/release/PortFinder"

          mkdir -p pkg/usr/bin
          cp "$BIN" pkg/usr/bin/PortFinder
          chmod +x pkg/usr/bin/PortFinder

          # Rewrite the libpcap SONAME embedded in DT_NEEDED.
          # Ubuntu's libpcap0.8 package ships SONAME `libpcap.so.0.8`
          # and rustc bakes that into the binary at link time, so the
          # binary won't load on Fedora / RHEL / openSUSE / Arch —
          # all of which ship `libpcap.so.1`. The 0.x -> 1.x bump in
          # 2008 was a project rebranding, not an ABI break: every
          # symbol the pcap crate uses (pcap_open_live, pcap_close,
          # pcap_loop, ...) is identical across the two SONAMEs, and
          # the Tauri-era binary on this repo was actually broken on
          # Fedora for the same reason — nobody had tested it. Patch
          # the copy in `pkg/usr/bin/PortFinder` only; the .deb (built
          # separately by cargo-packager from `target/release/`) keeps
          # the libpcap.so.0.8 SONAME which is correct for Debian /
          # Ubuntu installs.
          sudo apt-get install -y patchelf
          patchelf --replace-needed libpcap.so.0.8 libpcap.so.1 pkg/usr/bin/PortFinder
          echo "Patched DT_NEEDED:"
          patchelf --print-needed pkg/usr/bin/PortFinder | grep -i pcap

          # Install the .desktop file as `PortFinder.desktop` so it
          # matches the AppStream launchable id (which itself matches
          # cargo-packager's auto-gen name for the .deb). Single
          # capitalised filename across every Linux package format.
          mkdir -p pkg/usr/share/applications
          cp packaging/linux/portfinder.desktop pkg/usr/share/applications/PortFinder.desktop

          mkdir -p pkg/usr/share/icons/hicolor/512x512/apps
          cp resources/icons/icon.png pkg/usr/share/icons/hicolor/512x512/apps/portfinder.png

          # AppStream metainfo — GNOME Software reads this to show
          # the proper name, license, summary, and "by packetThrower"
          # in its install UI. Without it the Software center shows
          # "PortFinder-4 / Unknown author / Unknown license" because
          # it falls back to parsing the .rpm filename.
          mkdir -p pkg/usr/share/metainfo
          cp packaging/linux/io.github.packetThrower.PortFinder.metainfo.xml \
             pkg/usr/share/metainfo/

          mkdir -p release-artifacts
          # `()(64bit)` arch qualifier on every SONAME: RPM-based
          # distros auto-generate library `Provides:` as
          # `libfoo.so.N()(64bit)` on 64-bit arches — both aarch64
          # and x86_64 use the same 64bit token.
          # `--log info` makes fpm surface rpmbuild's stdout/stderr
          # if rpmbuild dies. The default `warn` level swallows
          # them, so a failure only prints "rpmbuild failed (exit
          # code 1)" with no clue *why* — exactly what burned us
          # on the alpha.5 attempt at tightening this section.
          fpm --log info -s dir -t rpm -C pkg \
            --name portfinder --version "$VERSION" --architecture "$ARCH" \
            --license GPL-3.0-or-later \
            --description "Network switch port discovery via CDP/LLDP/MNDP." \
            --url "https://packetthrower.github.io/PortFinder/" \
            --vendor "packetThrower" --maintainer "packetThrower" \
            --depends 'libpcap.so.1()(64bit)' \
            --depends 'libxkbcommon.so.0()(64bit)' \
            --depends 'libxkbcommon-x11.so.0()(64bit)' \
            --depends 'libwayland-client.so.0()(64bit)' \
            --depends 'libwayland-cursor.so.0()(64bit)' \
            --depends 'libX11.so.6()(64bit)' \
            --depends 'libxcb.so.1()(64bit)' \
            --depends 'libxcb-cursor.so.0()(64bit)' \
            --depends 'libxcb-randr.so.0()(64bit)' \
            --depends 'libxcb-render.so.0()(64bit)' \
            --depends 'libxcb-shape.so.0()(64bit)' \
            --depends 'libxcb-xfixes.so.0()(64bit)' \
            --depends 'libxcb-xkb.so.1()(64bit)' \
            --depends 'libfontconfig.so.1()(64bit)' \
            --depends 'libfreetype.so.6()(64bit)' \
            --after-install packaging/linux/portfinder-postinstall.sh \
            --before-remove packaging/linux/portfinder-preremove.sh \
            --package "release-artifacts/PortFinder-${VERSION}-1.${ARCH}.rpm"

      - name: Build .pkg.tar.zst via fpm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.rpm_arch }}"
          fpm --log info -s dir -t pacman -C pkg \
            --name portfinder --version "$VERSION" --architecture "$ARCH" \
            --license GPL-3.0-or-later \
            --description "Network switch port discovery via CDP/LLDP/MNDP." \
            --url "https://packetthrower.github.io/PortFinder/" \
            --vendor "packetThrower" --maintainer "packetThrower" \
            --after-install packaging/linux/portfinder-postinstall.sh \
            --before-remove packaging/linux/portfinder-preremove.sh \
            --package "release-artifacts/portfinder-${VERSION}-1-${ARCH}.pkg.tar.zst"

      - name: Stage artifacts
        run: |
          mkdir -p release-artifacts
          BUNDLE="target/release"
          echo "--- cargo-packager outputs ---"
          ls -la "$BUNDLE" 2>/dev/null || true
          cp "$BUNDLE"/*.deb release-artifacts/ 2>/dev/null || true
          cp "$BUNDLE"/*.AppImage release-artifacts/ 2>/dev/null || true
          echo "--- staged ---"
          ls -la release-artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.arch }}-package
          path: release-artifacts/*

  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: "*-package"

      - name: Generate SHA256SUMS
        run: |
          for dir in artifacts/*/; do
            (cd "$dir" && sha256sum ./*)
          done | sort > SHA256SUMS
          cat SHA256SUMS

      - name: Build release notes
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"

          if [[ "${CURRENT_TAG}" == *-* ]]; then
            IS_PRERELEASE=1
            PREV_TAG=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || true)
          else
            IS_PRERELEASE=0
            PREV_TAG=$(git describe --tags --abbrev=0 --exclude='*-*' "${CURRENT_TAG}^" 2>/dev/null || true)
          fi

          {
            if [ "$IS_PRERELEASE" = "1" ]; then
              echo "> Pre-release. Published for testing. Behaviour and artifacts are not final."
              echo
            fi

            echo "## What's Changed"
            echo
            if [ -n "$PREV_TAG" ]; then
              git log --no-merges --format='* %s (%h)' "${PREV_TAG}..${CURRENT_TAG}"
              echo
              echo "**Full Changelog**: ${REPO_URL}/compare/${PREV_TAG}...${CURRENT_TAG}"
            else
              git log --no-merges --format='* %s (%h)' "${CURRENT_TAG}"
              echo
              echo "**Full Changelog**: ${REPO_URL}/commits/${CURRENT_TAG}"
            fi
          } > release-notes.md

          echo "--- Generated release notes ---"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: |
            artifacts/macos-package/*
            artifacts/windows-amd64-package/*
            artifacts/windows-arm64-package/*
            artifacts/linux-amd64-package/*
            artifacts/linux-arm64-package/*
            SHA256SUMS
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
