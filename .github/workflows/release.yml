name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: [ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS — single universal build that runs on Apple Silicon AND Intel
          - runner: macos-latest
            arch: universal
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'

          # Linux x86_64
          - runner: ubuntu-latest
            arch: amd64
            args: ''
            rust-targets: ''

          # Linux ARM64 — native ARM runner, no cross-compile
          - runner: ubuntu-24.04-arm
            arch: arm64
            args: ''
            rust-targets: ''

          # Windows x86_64
          - runner: windows-latest
            arch: amd64
            args: ''
            rust-targets: ''
            npcap_lib: x64

          # Windows ARM64 — native ARM runner
          - runner: windows-11-arm
            arch: arm64
            args: ''
            rust-targets: ''
            npcap_lib: ARM64

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpcap-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Cache Npcap SDK
        if: startsWith(matrix.runner, 'windows')
        id: cache-npcap
        uses: actions/cache@v5
        with:
          path: npcap-sdk
          key: npcap-sdk-1.13

      - name: Download Npcap SDK
        if: startsWith(matrix.runner, 'windows') && steps.cache-npcap.outputs.cache-hit != 'true'
        run: |
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-1.13.zip" -OutFile npcap-sdk.zip
          Expand-Archive npcap-sdk.zip -DestinationPath npcap-sdk
        shell: powershell

      - name: Configure Npcap link path
        if: startsWith(matrix.runner, 'windows')
        run: |
          echo "LIB=${{ github.workspace }}\npcap-sdk\Lib\${{ matrix.npcap_lib }};$env:LIB" >> $env:GITHUB_ENV
        shell: powershell

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.arch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install frontend deps
        run: pnpm install
        working-directory: frontend

      - name: Build with tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'PortFinder ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build BPF helper pkg (macOS)
        if: matrix.runner == 'macos-latest'
        run: ./packaging/macos/build-pkg.sh

      - name: Upload BPF helper pkg
        if: matrix.runner == 'macos-latest'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/PortFinder-BPF-*.pkg
