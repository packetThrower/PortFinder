name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  # Detect whether this push/PR touched any code path. Skipped when CI
  # is invoked via workflow_call (release pipeline) so build always runs
  # for releases.
  changes:
    if: github.event_name != 'workflow_call'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src-tauri/**'
              - 'frontend/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'

  build:
    needs: [changes]
    if: |
      always() &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpcap-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install
          pnpm run build

      - name: Cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test --lib

  # Rollup job that branch protection should require. Always runs and
  # passes when build either succeeded or was correctly skipped (docs-
  # only changes). Fails when build itself failed or was cancelled.
  ci:
    name: CI
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check build status
        run: |
          case "${{ needs.build.result }}" in
            success|skipped)
              echo "build: ${{ needs.build.result }} → CI passes"
              ;;
            *)
              echo "build: ${{ needs.build.result }} → CI fails"
              exit 1
              ;;
          esac
