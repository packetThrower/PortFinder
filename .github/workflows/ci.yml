name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
      - "docs-next/**"
      - ".github/workflows/docs.yml"
      - ".github/FUNDING.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
      - "docs-next/**"
      - ".github/workflows/docs.yml"
      - ".github/FUNDING.yml"
  # release.yml gates on a green CI run before building artifacts.
  workflow_call:

# Read-only — neither CI nor the release ci-call needs write.
permissions:
  contents: read

# Cancel superseded PR runs. Pushes to main and workflow_call invocations
# always run to completion so a release isn't taken out by a follow-up
# commit landing during artifact builds.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS — Apple Silicon only. The matching `build-macos`
          # release job cross-compiles x86_64-apple-darwin from
          # this runner (see release.yml), so we don't need the
          # slow / scarce `macos-15-intel` runner in CI to verify
          # the Intel build — clippy + test on arm64 plus the
          # release-time cross-compile cover what matters.
          - runner: macos-26
            arch: arm64
          # Windows — x64 + arm64. windows-11-arm landed in 2025,
          # native ARM runner, no Prism cross-compile dance.
          - runner: windows-latest
            arch: amd64
            npcap_lib: x64
          - runner: windows-11-arm
            arch: arm64
            npcap_lib: ARM64
          # Linux — amd64 + arm64.
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      # Third-party actions pinned to a full commit SHA. `persist-
      # credentials: false` — this job never `git push`es.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Rust (stable + clippy)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Preserve the cache even when a later step (clippy, test)
          # fails. Default is to discard on failure, which forces a
          # full recompile on the retry — wasteful when the failure
          # is a flake or a one-line lint fix.
          cache-on-failure: true

      # Linux: libpcap for the capture crate, plus the wayland +
      # x11 surface gpui_linux needs at compile time. No GTK /
      # WebKit / appindicator — gpui owns the window + renderer
      # end-to-end; the 3.x Tauri build needed all that, the 4.x
      # gpui build doesn't.
      - name: Install Linux deps
        if: startsWith(matrix.runner, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpcap-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev libxcb1-dev libxcb-randr0-dev \
            libxcb-xkb-dev libxcb-cursor-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb-render0-dev \
            libfontconfig1-dev libfreetype-dev \
            pkg-config

      - name: Install macOS deps
        if: startsWith(matrix.runner, 'macos-')
        run: brew install pkg-config

      # Windows: Npcap SDK is what the `pcap` crate links against
      # (wpcap.lib). Cached across runs so we don't redownload it
      # every CI invocation.
      - name: Cache Npcap SDK
        if: startsWith(matrix.runner, 'windows')
        id: cache-npcap
        uses: actions/cache@v6
        with:
          path: npcap-sdk
          key: npcap-sdk-1.13

      - name: Download Npcap SDK
        if: startsWith(matrix.runner, 'windows') && steps.cache-npcap.outputs.cache-hit != 'true'
        run: |
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-1.13.zip" -OutFile npcap-sdk.zip
          Expand-Archive npcap-sdk.zip -DestinationPath npcap-sdk
        shell: powershell

      - name: Configure Npcap link path
        if: startsWith(matrix.runner, 'windows')
        run: |
          echo "LIB=${{ github.workspace }}\npcap-sdk\Lib\${{ matrix.npcap_lib }};$env:LIB" >> $env:GITHUB_ENV
        shell: powershell

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test
